function vAdmin(){if(!adm())return '<div class="card pad">Kein Zugriff.</div>';var h=crumb(' › Admin-Panel')+'<div class="tabs">'+[["m","👥 Mitglieder"],["c","🗂️ Kategorien"],["w","🎨 Website"],["l","📋 Protokoll"]].map(function(x){return '<button class="'+(S.tab==x[0]?'':'ghost')+'" onclick="S.tab=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join("")+'</div>';
if(S.tab=="m"){var ids=Object.keys(US);h+='<div class="card"><h3>Mitglieder ('+ids.length+')</h3>'+(ids.length?ids.map(function(i){var m=US[i],a=(m.warns||[]).filter(function(x){return x.on}).length,b=isBan(m);return '<div class="row">'+av(i,38)+'<div class="grow"><b>'+E(m.name)+'</b> '+bd(m)+'<div class="m">Verwarnungen '+a+'/3'+(b?' · <span style="color:#ff5c7a">gebannt'+(m.ban.until?' bis '+new Date(m.ban.until).toLocaleString("de-DE"):' (permanent'+(m.ban.ip?', IP':'')+')')+' – '+E(m.ban.r)+'</span>':'')+'</div></div><div><button class="sm" onclick="act(\''+i+'\',\'roles\')">Rollen</button>'+(i==uid?'':'<button class="sm ghost" onclick="act(\''+i+'\',\'warn\')">Verwarnen</button>'+(a?'<button class="sm ghost" onclick="act(\''+i+'\',\'unwarn\')">Verwarnung zurück</button>':'')+(b?'<button class="sm" onclick="act(\''+i+'\',\'unban\')">Entbannen</button>':'<button class="sm dg" onclick="act(\''+i+'\',\'ban\')">Bannen</button><button class="sm dg" onclick="act(\''+i+'\',\'ip\')">IP-Bann</button>'))+'</div></div>'}).join(""):'<div class="pad m">Noch keine Registrierungen.</div>')+'</div>'}
else if(S.tab=="c"){h+=CFG.cats.map(function(c,i){return '<div class="card pad"><div class="row" style="border:0;padding:0"><input class="f" style="width:60px;margin:0" value="'+E(c.ic)+'" onchange="cs('+i+',\'ic\',this.value)"><input class="f" style="flex:1;margin:0" value="'+E(c.n)+'" onchange="cs('+i+',\'n\',this.value)"></div><input class="f" style="margin-top:10px" value="'+E(c.d)+'" placeholder="Beschreibung" onchange="cs('+i+',\'d\',this.value)"><input class="f" value="'+E(c.g)+'" placeholder="Gruppe" onchange="cs('+i+',\'g\',this.value)"><div class="m" style="margin-bottom:8px">Schreibrechte: '+((c.roles||[]).length+(c.users||[]).length)+' ('+(c.roles||[]).length+' Rollen, '+(c.users||[]).length+' Personen)</div><button class="sm" onclick="perm('+i+')">🔑 Schreibrechte</button><button class="sm dg" onclick="CFG.cats.splice('+i+',1);saveCfg();render()">Löschen</button></div>'}).join("")+'<button onclick="CFG.cats.push({id:\'c\'+Date.now(),ic:\'📁\',n:\'Neue Kategorie\',d:\'\',g:\'Allgemein\',roles:[],users:[]});saveCfg();render()">+ Kategorie</button>'}
else if(S.tab=="w"){h+='<div class="card pad"><div class="m">Seitenname</div><input class="f" id="wt" value="'+E(CFG.title)+'"><div class="m">Hero-Titel</div><input class="f" id="wh" value="'+E(CFG.ht)+'"><div class="m">Hero-Text</div><textarea id="wx" rows="3">'+E(CFG.hx)+'</textarea><div class="m">Akzentfarbe</div><input class="f" type="color" id="wa" value="'+E(CFG.ac)+'" style="height:46px"><div class="m">Anticheat-Wortliste (kommagetrennt)</div><textarea id="wb" rows="4">'+E((CFG.bad||[]).join(", "))+'</textarea><button class="ghost" onclick="stp()">🏷️ Wer darf Status vergeben?</button> <button onclick="sw()">Speichern</button></div>'}

return h}
function cs(i,k,v){CFG.cats[i][k]=v;saveCfg()}
function perm(i){var c=CFG.cats[i],g=[["Rollen",RL.map(function(r){return ["r:"+r[0],r[0]]})],["Personen",Object.keys(US).map(function(u){return ["u:"+u,US[u].name]})]];chk("Schreibrechte: "+c.n,g,(c.roles||[]).map(function(r){return "r:"+r}).concat((c.users||[]).map(function(u){return "u:"+u})),function(v){c.roles=v.filter(function(x){return x[0]=="r"}).map(function(x){return x.slice(2)});c.users=v.filter(function(x){return x[0]=="u"}).map(function(x){return x.slice(2)});saveCfg();render()})}

function reg(){var n=$("rn").value.trim();if(n.length<3)return T("Mindestens 3 Zeichen.");if(Object.keys(US).some(function(i){return US[i].name.toLowerCase()==n.toLowerCase()}))return T("Name bereits vergeben.");if(bad(n))return T("Dieser Name ist nicht erlaubt.");D.doc("users/"+uid).set({name:n,roles:[],warns:[],hist:[],ban:null,created:Date.now()}).then(function(){setLG(true);T("Willkommen, "+n+"!")}).catch(function(){T("Registrierung fehlgeschlagen.")})}
function stx(s){s=ST[s||0];return '<span class="badge" style="background:'+(s[1]||'var(--bd)')+';color:'+(s[2]||'var(--mu)')+'">'+s[0]+'</span>'}
function stsel(id,i,s){return '<select style="width:auto;margin:0 6px;padding:4px 8px;font-size:12px" onchange="sst(\''+id+'\','+i+',this.value)">'+ST.map(function(x,j){return '<option value="'+j+'"'+(j==s?' selected':'')+'>Status: '+x[0]+'</option>'}).join("")+'</select>'}

function stp(){chk("Wer darf Status vergeben?",[["Rollen",RL.map(function(r){return ["r:"+r[0],r[0]+" ("+LV[r[2]]+")"]})],["Personen",Object.keys(US).map(function(u){return ["u:"+u,US[u].name]})]],(CFG.stR||[]).map(function(r){return "r:"+r}).concat((CFG.stU||[]).map(function(u){return "u:"+u})),function(v){CFG.stR=v.filter(function(x){return x[0]=="r"}).map(function(x){return x.slice(2)});CFG.stU=v.filter(function(x){return x[0]=="u"}).map(function(x){return x.slice(2)});saveCfg();T("Status-Berechtigung gespeichert.")})}
function dvid(){try{var d=localStorage.getItem("dv");if(!d){d=Math.random().toString(36).slice(2);localStorage.setItem("dv",d)}return d}catch(e){return "x"}}
async function hsh(p,s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+":"+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}

async function reg(){var n=$("an").value.trim(),p=$("ap").value,dv=dvid();if(n.length<3)return T("Benutzername: mindestens 3 Zeichen.");if(p.length<6)return T("Passwort: mindestens 6 Zeichen.");if(p!=$("ap2").value)return T("Passwörter stimmen nicht überein.");if(Object.keys(US).some(function(i){return US[i].name.toLowerCase()==n.toLowerCase()}))return T("Name bereits vergeben.");if(bad(n))return T("Dieser Name ist nicht erlaubt.");if(Object.keys(US).some(function(i){return US[i].dev==dv&&isBan(US[i])&&!US[i].ban.until}))return T("Dieses Gerät ist gesperrt.");var s=Math.random().toString(36).slice(2)+Date.now(),h=await hsh(p,s);D.collection("users").add({owner:Object.keys(US).length==0,name:n,salt:s,pw:h,dev:dv,roles:[],warns:[],hist:[],ban:null,created:Date.now()}).then(function(r){setAcct(r.id);T("Willkommen, "+n+"!")}).catch(function(){T("Registrierung fehlgeschlagen.")})}
async function login(){var n=$("an").value.trim().toLowerCase(),p=$("ap").value,id=Object.keys(US).find(function(i){return US[i].name.toLowerCase()==n});if(!id||!US[id].pw||await hsh(p,US[id].salt)!=US[id].pw)return T("Benutzername oder Passwort falsch.");setAcct(id);T("Angemeldet.")}

function rep(id){var x=$("rt").value.trim(),t=TH.find(function(q){return q.id==id});if(!x||!t)return;if(!can(cat(t.c)))return T("Keine Berechtigung.");if(bad(x))return flag();D.doc("threads/"+id).update({posts:t.posts.concat([{u:uid,x:x,t:Date.now(),s:0}]),w:Date.now()})}

var v=S.v;h+=v=="home"?vHome():v=="cat"?vCat():v=="search"?vSearch():v=="thread"?vThread():v=="new"?vNew():v=="auth"?vAuth2():v=="prof"?vProf():vAdmin();$("app").innerHTML=h}

render();
